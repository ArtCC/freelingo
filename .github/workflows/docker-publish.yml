name: Build and publish Docker images

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/artcc/freelingo-backend
  FRONTEND_IMAGE: ghcr.io/artcc/freelingo-frontend
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      short-sha: ${{ steps.sha.outputs.short-sha }}
    steps:
      - uses: actions/checkout@v6
      - id: sha
        run: echo "short-sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

  build-backend:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        arch:
          - runs-on: ubuntu-latest
            platform: linux/amd64
            suffix: amd64
          - runs-on: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    runs-on: ${{ matrix.arch.runs-on }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          provenance: false
          platforms: ${{ matrix.arch.platform }}
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest-${{ matrix.arch.suffix }}
            ${{ env.BACKEND_IMAGE }}:${{ needs.prepare.outputs.short-sha }}-${{ matrix.arch.suffix }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        arch:
          - runs-on: ubuntu-latest
            platform: linux/amd64
            suffix: amd64
          - runs-on: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    runs-on: ${{ matrix.arch.runs-on }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          provenance: false
          platforms: ${{ matrix.arch.platform }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest-${{ matrix.arch.suffix }}
            ${{ env.FRONTEND_IMAGE }}:${{ needs.prepare.outputs.short-sha }}-${{ matrix.arch.suffix }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  merge-backend:
    needs: [prepare, build-backend]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Merge backend manifests
        run: |
          docker buildx imagetools create -t ${{ env.BACKEND_IMAGE }}:latest \
            ${{ env.BACKEND_IMAGE }}:latest-amd64 \
            ${{ env.BACKEND_IMAGE }}:latest-arm64
          docker buildx imagetools create -t ${{ env.BACKEND_IMAGE }}:${{ needs.prepare.outputs.short-sha }} \
            ${{ env.BACKEND_IMAGE }}:${{ needs.prepare.outputs.short-sha }}-amd64 \
            ${{ env.BACKEND_IMAGE }}:${{ needs.prepare.outputs.short-sha }}-arm64

  merge-frontend:
    needs: [prepare, build-frontend]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Merge frontend manifests
        run: |
          docker buildx imagetools create -t ${{ env.FRONTEND_IMAGE }}:latest \
            ${{ env.FRONTEND_IMAGE }}:latest-amd64 \
            ${{ env.FRONTEND_IMAGE }}:latest-arm64
          docker buildx imagetools create -t ${{ env.FRONTEND_IMAGE }}:${{ needs.prepare.outputs.short-sha }} \
            ${{ env.FRONTEND_IMAGE }}:${{ needs.prepare.outputs.short-sha }}-amd64 \
            ${{ env.FRONTEND_IMAGE }}:${{ needs.prepare.outputs.short-sha }}-arm64
